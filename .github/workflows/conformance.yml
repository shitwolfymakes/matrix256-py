name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fixtures:
    name: Tier-1 fixtures (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out matrix256-py
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: matrix256-py

      - name: Check out matrix256 spec repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: shitwolfymakes/matrix256
          path: matrix256

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run synthetic fixture suite
        working-directory: matrix256-py
        run: python tests/generate_fixtures.py
